# Spirit Belongings: one Cloudflare Worker serves the web app (static files)
# and the server API under /api/*.
name = "keranjang-impian"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Online address of this app (EOI domain, one subdomain per app).
routes = [{ pattern = "spirit-belongings.eoi-apps.my.id", custom_domain = true }]
workers_dev = false # only the address above, no extra *.workers.dev copy
preview_urls = false

# The exported web app (built from ../app with `npx expo export --platform web`).
[assets]
directory = "../app/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "keranjang-impian"
database_id = "7f833401-1f57-44cc-8aa8-e598670d5b5a"
migrations_dir = "migrations"

# Safety net: ask DOKU about pending orders every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
DOKU_BASE_URL = "https://api-sandbox.doku.com" # production: https://api.doku.com
APP_URL = "https://spirit-belongings.eoi-apps.my.id" # where DOKU sends the buyer back after paying
# Local development overrides APP_URL and adds ALLOWED_ORIGIN in .dev.vars.

# Secrets (never in this file): DOKU_CLIENT_ID, DOKU_SECRET_KEY.
# Local: put them in .dev.vars. Online: `npx wrangler secret put DOKU_SECRET_KEY`.
