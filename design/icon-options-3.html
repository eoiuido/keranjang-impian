<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Belongings: ikon F1</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F5F5F7; color: #111114; margin: 0; padding: 24px 16px 40px; }
  h1 { font-size: 20px; text-align: center; margin: 0 0 4px; }
  p.lead { text-align: center; color: #6B6B73; font-size: 13px; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 640px; margin: 0 auto; }
  .opt { background: #fff; border-radius: 18px; padding: 14px; text-align: center; }
  .opt canvas { width: 150px; height: 150px; border-radius: 32px; display: block; margin: 0 auto; }
  .opt b { display: block; margin-top: 10px; font-size: 14px; }
  .opt span { display: block; color: #6B6B73; font-size: 12px; margin-top: 2px; }
  .small { display: flex; gap: 8px; justify-content: center; margin-top: 10px; align-items: center; }
  .small canvas { width: 40px; height: 40px; border-radius: 9px; }
  .small canvas.xs { width: 20px; height: 20px; border-radius: 4px; }
  h2 { max-width: 640px; margin: 26px auto 10px; font-size: 15px; }
  .items { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 640px; margin: 0 auto; }
  .items div { background: #fff; border-radius: 14px; padding: 10px 12px; text-align: center; font-size: 12px; color: #6B6B73; }
  .items canvas { width: 96px; height: 96px; display: block; margin: 0 auto 6px; }
</style>
</head>
<body>
<h1>F1: high heels baru, lilac lebih ungu</h1>
<p class="lead">Besar = layar utama HP; kecil = tab browser.</p>
<div class="grid" id="grid"></div>
<h2>High heels: lama vs baru</h2>
<div class="items" id="items"></div>
<script>
const S = {
  tumbler: ['M7 5h10l-1 2.5H8z','M8 7.5l1.1 12.2a1.6 1.6 0 0 0 1.6 1.3h2.6a1.6 1.6 0 0 0 1.6-1.3L16 7.5','M13 5l1.6-3','M15.7 10.5h1.2a2 2 0 0 1 2 2v2.2a2 2 0 0 1-2 2h-1.6'],
  handbag: ['M4.5 10h15l-1.2 9.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z','M8.5 10V8.5a3.5 3.5 0 0 1 7 0V10','M4.9 12.6c2.3 1.4 4.6 2 7.1 2s4.8-.6 7.1-2'],
  heelOld: ['M2.5 18c0-1.5 1.2-2.6 2.7-2.6 2.6 0 4.7-.6 6.4-2.2','M11.6 13.2c1.6 1.2 3.4 1.2 5 .1L20 9.6v2','M2.5 18h6.5c3.6 0 6.6-2.6 8.6-5.8L20 11.6','M17.6 12.4 18.2 21h1.1l.7-9.4'],
  // New pump: one closed outline (pointed toe, open throat, tall back) + a clear stiletto.
  heel: [
    'M2 16.6c0-1.2.9-2.1 2.1-2.2l4.6-.4c2.2-.2 4.2-1.3 5.6-3l3.4-4.2c.8-1 2.4-.7 2.8.5l1.1 3.4',
    'M2 16.6c0 .8.6 1.4 1.4 1.4h5.4c3.6 0 6.9-2 8.6-5.2l.9-1.8',
    'M21.6 10.7l-1.5 1.4',
    'M17.9 12.4l1 8.6',
    'M20.1 12.1l-.4 8.9',
    'M18.9 21h.8',
  ],
  lipstick: ['M8.5 13h7v7a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z','M9.5 13v-2.5h5V13','M10.2 10.5V6.8L13.8 4v6.5'],
};
const CLASP = (ctx, s, cx, cy, color, stroke) => { ctx.save(); ctx.translate(cx - 12*s, cy - 12*s); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.beginPath(); ctx.arc(12, 14.7, 1, 0, Math.PI*2); ctx.stroke(); ctx.restore(); };
const PINK = '#D6336C';
const LILACS = { old: '#E4D6FF', p1: '#D2B8FF', p2: '#C29EFF' };

function icon(ctx, name, cx, cy, size, color, stroke) {
  const s = size / 24;
  ctx.save();
  ctx.translate(cx - 12 * s, cy - 12 * s);
  ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const d of S[name]) ctx.stroke(new Path2D(d));
  ctx.restore();
  if (name === 'handbag') CLASP(ctx, s, cx, cy, color, stroke);
}
function f1(color, heelName, heelScale) {
  return (c, n) => {
    c.fillStyle = PINK; c.fillRect(0, 0, n, n);
    const z = n * 0.32, w = 1.5;
    icon(c, 'tumbler', n * 0.31, n * 0.31, z, color, w);
    icon(c, 'handbag', n * 0.69, n * 0.31, z, color, w);
    icon(c, heelName, n * 0.31, n * 0.69, z * heelScale, color, w);
    icon(c, 'lipstick', n * 0.69, n * 0.69, z, color, w);
  };
}
const OPTIONS = [
  { title: 'F1 lama', note: 'Untuk perbandingan', draw: f1(LILACS.old, 'heelOld', 1) },
  { title: 'F1 baru · ungu 1', note: 'Heels baru, lilac keunguan', draw: f1(LILACS.p1, 'heel', 1.12) },
  { title: 'F1 baru · ungu 2', note: 'Heels baru, lebih ungu lagi', draw: f1(LILACS.p2, 'heel', 1.12) },
];
function canvasFor(opt, px, cls) {
  const c = document.createElement('canvas');
  c.width = c.height = px * 2;
  if (cls) c.className = cls;
  opt.draw(c.getContext('2d'), px * 2);
  return c;
}
const grid = document.getElementById('grid');
OPTIONS.forEach((o) => {
  const box = document.createElement('div');
  box.className = 'opt';
  box.appendChild(canvasFor(o, 150));
  const small = document.createElement('div');
  small.className = 'small';
  small.appendChild(canvasFor(o, 40));
  small.appendChild(canvasFor(o, 20, 'xs'));
  box.appendChild(small);
  box.insertAdjacentHTML('beforeend', `<b>${o.title}</b><span>${o.note}</span>`);
  grid.appendChild(box);
});
const items = document.getElementById('items');
[['heelOld', 'Lama', '#111114'], ['heel', 'Baru', '#111114'], ['heel', 'Baru (ungu 2 di pink)', null]].forEach(([k, label, color]) => {
  const d = document.createElement('div');
  const c = document.createElement('canvas'); c.width = c.height = 192;
  const ctx = c.getContext('2d');
  if (!color) { ctx.fillStyle = PINK; ctx.fillRect(0, 0, 192, 192); }
  icon(ctx, k, 96, 96, 160, color ?? LILACS.p2, 1.5);
  d.appendChild(c); d.appendChild(document.createTextNode(label)); items.appendChild(d);
});
</script>
</body>
</html>
