<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Belongings: pilihan ikon 2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F5F5F7; color: #111114; margin: 0; padding: 24px 16px 40px; }
  h1 { font-size: 20px; text-align: center; margin: 0 0 4px; }
  p.lead { text-align: center; color: #6B6B73; font-size: 13px; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 780px; margin: 0 auto; }
  .opt { background: #fff; border-radius: 18px; padding: 14px; text-align: center; }
  .opt canvas { width: 120px; height: 120px; border-radius: 26px; display: block; margin: 0 auto; }
  .opt b { display: block; margin-top: 10px; font-size: 14px; }
  .opt span { display: block; color: #6B6B73; font-size: 12px; margin-top: 2px; }
  .small { display: flex; gap: 8px; justify-content: center; margin-top: 10px; align-items: center; }
  .small canvas { width: 32px; height: 32px; border-radius: 8px; }
  .small canvas.xs { width: 16px; height: 16px; border-radius: 3px; }
  h2 { max-width: 780px; margin: 26px auto 10px; font-size: 15px; }
  .items { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 780px; margin: 0 auto; }
  .items div { background: #fff; border-radius: 14px; padding: 10px 12px; text-align: center; font-size: 12px; color: #6B6B73; }
  .items canvas { width: 72px; height: 72px; display: block; margin: 0 auto 6px; }
</style>
</head>
<body>
<h1>Pilihan ikon: latar pink, garis lilac</h1>
<p class="lead">Garis lebih tipis, tumbler 10% lebih besar. Besar = layar utama HP; kecil = tab browser.</p>
<div class="grid" id="grid"></div>
<h2>Gambar barang yang baru</h2>
<div class="items" id="items"></div>
<script>
const S = {
  tumbler: ['M7 5h10l-1 2.5H8z','M8 7.5l1.1 12.2a1.6 1.6 0 0 0 1.6 1.3h2.6a1.6 1.6 0 0 0 1.6-1.3L16 7.5','M13 5l1.6-3','M15.7 10.5h1.2a2 2 0 0 1 2 2v2.2a2 2 0 0 1-2 2h-1.6'],
  handbag: ['M4.5 10h15l-1.2 9.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z','M8.5 10V8.5a3.5 3.5 0 0 1 7 0V10','M4.9 12.6c2.3 1.4 4.6 2 7.1 2s4.8-.6 7.1-2'],
  heel: ['M2.5 18c0-1.5 1.2-2.6 2.7-2.6 2.6 0 4.7-.6 6.4-2.2','M11.6 13.2c1.6 1.2 3.4 1.2 5 .1L20 9.6v2','M2.5 18h6.5c3.6 0 6.6-2.6 8.6-5.8L20 11.6','M17.6 12.4 18.2 21h1.1l.7-9.4'],
  lipstick: ['M8.5 13h7v7a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z','M9.5 13v-2.5h5V13','M10.2 10.5V6.8L13.8 4v6.5'],
  perfume: ['M9 10h6a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3z','M10.3 10V8h3.4v2','M9.2 4.5h5.6v3.5H9.2z','M9 15.5h6'],
};
const CLASP = (ctx, s, cx, cy, color, stroke) => { ctx.save(); ctx.translate(cx - 12*s, cy - 12*s); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.beginPath(); ctx.arc(12, 14.7, 1, 0, Math.PI*2); ctx.stroke(); ctx.restore(); };
const PINK = '#D6336C', LILAC = '#E4D6FF', LILAC_DEEP = '#CDB8F6', WHITE = '#FFFFFF';

function icon(ctx, name, cx, cy, size, color, stroke) {
  const s = size / 24;
  ctx.save();
  ctx.translate(cx - 12 * s, cy - 12 * s);
  ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const d of S[name]) ctx.stroke(new Path2D(d));
  ctx.restore();
  if (name === 'handbag') CLASP(ctx, s, cx, cy, color, stroke);
}
const bg = (c, n, color) => { c.fillStyle = color; c.fillRect(0, 0, n, n); };

const OPTIONS = [
  { title: 'D1. Tumbler', note: 'Garis lilac muda', draw: (c, n) => { bg(c,n,PINK); icon(c,'tumbler',n/2,n/2,n*0.616,LILAC,1.35); } },
  { title: 'D2. Tumbler', note: 'Lilac sedikit lebih tua', draw: (c, n) => { bg(c,n,PINK); icon(c,'tumbler',n/2,n/2,n*0.616,LILAC_DEEP,1.35); } },
  { title: 'E1. 3 barang', note: 'Tas tangan, tumbler, high heels', draw: (c, n) => { bg(c,n,PINK); const w=1.45; icon(c,'handbag',n*0.33,n*0.38,n*0.38,LILAC,w); icon(c,'tumbler',n*0.67,n*0.37,n*0.40,LILAC,w); icon(c,'heel',n*0.5,n*0.70,n*0.42,LILAC,w); } },
  { title: 'E2. 3 barang', note: 'Tas, tumbler, lipstik', draw: (c, n) => { bg(c,n,PINK); const w=1.45; icon(c,'handbag',n*0.33,n*0.38,n*0.38,LILAC,w); icon(c,'tumbler',n*0.67,n*0.37,n*0.40,LILAC,w); icon(c,'lipstick',n*0.5,n*0.71,n*0.38,LILAC,w); } },
  { title: 'F1. 4 barang', note: 'Tumbler, tas, heels, lipstik', draw: (c, n) => { bg(c,n,PINK); const z=n*0.32, w=1.5; icon(c,'tumbler',n*0.31,n*0.31,z,LILAC,w); icon(c,'handbag',n*0.69,n*0.31,z,LILAC,w); icon(c,'heel',n*0.31,n*0.69,z,LILAC,w); icon(c,'lipstick',n*0.69,n*0.69,z,LILAC,w); } },
  { title: 'F2. 4 barang', note: 'Tumbler, tas, heels, parfum', draw: (c, n) => { bg(c,n,PINK); const z=n*0.32, w=1.5; icon(c,'tumbler',n*0.31,n*0.31,z,LILAC,w); icon(c,'handbag',n*0.69,n*0.31,z,LILAC,w); icon(c,'heel',n*0.31,n*0.69,z,LILAC,w); icon(c,'perfume',n*0.69,n*0.69,z,LILAC,w); } },
  { title: 'G1. Tas tangan', note: 'Satu barang saja', draw: (c, n) => { bg(c,n,PINK); icon(c,'handbag',n/2,n/2,n*0.62,LILAC,1.35); } },
  { title: 'G2. Lipstik', note: 'Satu barang saja', draw: (c, n) => { bg(c,n,PINK); icon(c,'lipstick',n/2,n/2,n*0.62,LILAC,1.35); } },
];

function canvasFor(opt, px, cls) {
  const c = document.createElement('canvas');
  c.width = c.height = px * 2;
  if (cls) c.className = cls;
  opt.draw(c.getContext('2d'), px * 2);
  return c;
}
const grid = document.getElementById('grid');
OPTIONS.forEach((o) => {
  const box = document.createElement('div');
  box.className = 'opt';
  box.appendChild(canvasFor(o, 120));
  const small = document.createElement('div');
  small.className = 'small';
  small.appendChild(canvasFor(o, 32));
  small.appendChild(canvasFor(o, 16, 'xs'));
  box.appendChild(small);
  box.insertAdjacentHTML('beforeend', `<b>${o.title}</b><span>${o.note}</span>`);
  grid.appendChild(box);
});
// The new outline drawings on their own, dark on white, to judge the shapes.
const items = document.getElementById('items');
[['handbag','Tas tangan'],['heel','High heels'],['lipstick','Lipstik'],['perfume','Parfum'],['tumbler','Tumbler']].forEach(([k, label]) => {
  const d = document.createElement('div');
  const c = document.createElement('canvas'); c.width = c.height = 144;
  icon(c.getContext('2d'), k, 72, 72, 120, '#111114', 1.6);
  d.appendChild(c); d.appendChild(document.createTextNode(label)); items.appendChild(d);
});
</script>
</body>
</html>
