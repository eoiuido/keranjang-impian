<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Belongings: pilihan ikon</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F5F5F7; color: #111114; margin: 0; padding: 24px 16px 40px; }
  h1 { font-size: 20px; text-align: center; margin: 0 0 4px; }
  p.lead { text-align: center; color: #6B6B73; font-size: 13px; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; max-width: 760px; margin: 0 auto; }
  .opt { background: #fff; border-radius: 18px; padding: 14px; text-align: center; }
  .opt canvas { width: 120px; height: 120px; border-radius: 26px; display: block; margin: 0 auto; }
  .opt b { display: block; margin-top: 10px; font-size: 14px; }
  .opt span { display: block; color: #6B6B73; font-size: 12px; margin-top: 2px; }
  .small { display: flex; gap: 8px; justify-content: center; margin-top: 10px; align-items: center; }
  .small canvas { width: 32px; height: 32px; border-radius: 8px; }
  .small canvas.xs { width: 16px; height: 16px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Pilihan ikon Spirit Belongings</h1>
<p class="lead">Besar = layar utama HP. Kecil di bawahnya = ukuran tab browser.</p>
<div class="grid" id="grid"></div>
<script>
const S = {
  tumbler: ['M7 5h10l-1 2.5H8z','M8 7.5l1.1 12.2a1.6 1.6 0 0 0 1.6 1.3h2.6a1.6 1.6 0 0 0 1.6-1.3L16 7.5','M13 5l1.6-3','M15.7 10.5h1.2a2 2 0 0 1 2 2v2.2a2 2 0 0 1-2 2h-1.6'],
  bag: ['M5 8.5h14l-1.1 11.6a1.5 1.5 0 0 1-1.5 1.4H7.6a1.5 1.5 0 0 1-1.5-1.4z','M9 8.5V7a3 3 0 0 1 6 0v1.5'],
  shoe: ['M3 15.5V9.8a1 1 0 0 1 1.3-.9l3.2 1.1 2.5-2.5 2 3.5c1.7 1.6 4.6 2.2 7 2.6a2 2 0 0 1 1.5 2v.9H3z','M3 18.5h18','M10.5 11.5l1.5-1M12 13.2l1.6-.9'],
  skincare: ['M7 9h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z','M7 9V6h3v3M8.5 6V3.5','M14.5 13h4.5v6.5a1.5 1.5 0 0 1-1.5 1.5H16a1.5 1.5 0 0 1-1.5-1.5z','M15.5 13v-2h2.5v2'],
  phone: ['M8.7 2.5h6.6a2.2 2.2 0 0 1 2.2 2.2v14.6a2.2 2.2 0 0 1-2.2 2.2H8.7a2.2 2.2 0 0 1-2.2-2.2V4.7a2.2 2.2 0 0 1 2.2-2.2z','M10.5 18.5h3'],
};
const PINK = '#D6336C', LILAC = '#A98BD4', LILAC_SOFT = '#EFE8F8', WHITE = '#FFFFFF';

// Draw one outline icon (24-unit grid) centered at (cx, cy) with the given size in px.
function icon(ctx, name, cx, cy, size, color, stroke) {
  const s = size / 24;
  ctx.save();
  ctx.translate(cx - 12 * s, cy - 12 * s);
  ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const d of S[name]) ctx.stroke(new Path2D(d));
  ctx.restore();
}

// Each option draws on an N×N square.
const OPTIONS = [
  { title: 'A. Sekarang', note: 'Pink, tumbler putih', draw: (c, n) => { c.fillStyle = PINK; c.fillRect(0,0,n,n); icon(c,'tumbler',n/2,n/2,n*0.56,WHITE,1.9); } },
  { title: 'B1. Lilac', note: 'Garis lebih tipis, 10% lebih besar', draw: (c, n) => { c.fillStyle = LILAC; c.fillRect(0,0,n,n); icon(c,'tumbler',n/2,n/2,n*0.616,WHITE,1.35); } },
  { title: 'B2. Putih + lilac', note: 'Tumbler lilac di latar putih', draw: (c, n) => { c.fillStyle = WHITE; c.fillRect(0,0,n,n); icon(c,'tumbler',n/2,n/2,n*0.616,LILAC,1.5); } },
  { title: 'B3. Lilac lembut', note: 'Latar lilac muda, garis lilac', draw: (c, n) => { c.fillStyle = LILAC_SOFT; c.fillRect(0,0,n,n); icon(c,'tumbler',n/2,n/2,n*0.616,'#7E5DB4',1.4); } },
  { title: 'C1. Barang impian', note: 'Tas, tumbler, sepatu (pink)', draw: (c, n) => { c.fillStyle = PINK; c.fillRect(0,0,n,n); icon(c,'bag',n*0.33,n*0.40,n*0.36,WHITE,1.6); icon(c,'tumbler',n*0.66,n*0.38,n*0.38,WHITE,1.6); icon(c,'shoe',n*0.5,n*0.70,n*0.42,WHITE,1.5); } },
  { title: 'C2. Barang impian', note: 'Sama, versi lilac', draw: (c, n) => { c.fillStyle = LILAC; c.fillRect(0,0,n,n); icon(c,'bag',n*0.33,n*0.40,n*0.36,WHITE,1.6); icon(c,'tumbler',n*0.66,n*0.38,n*0.38,WHITE,1.6); icon(c,'shoe',n*0.5,n*0.70,n*0.42,WHITE,1.5); } },
  { title: 'C3. 4 barang', note: 'Tumbler, tas, sepatu, skincare', draw: (c, n) => { c.fillStyle = PINK; c.fillRect(0,0,n,n); const z=n*0.30, w=1.6; icon(c,'tumbler',n*0.32,n*0.32,z,WHITE,w); icon(c,'bag',n*0.68,n*0.32,z,WHITE,w); icon(c,'shoe',n*0.32,n*0.68,z,WHITE,w); icon(c,'skincare',n*0.68,n*0.68,z,WHITE,w); } },
  { title: 'C4. 4 barang lilac', note: 'Sama, versi lilac', draw: (c, n) => { c.fillStyle = LILAC; c.fillRect(0,0,n,n); const z=n*0.30, w=1.6; icon(c,'tumbler',n*0.32,n*0.32,z,WHITE,w); icon(c,'bag',n*0.68,n*0.32,z,WHITE,w); icon(c,'shoe',n*0.32,n*0.68,z,WHITE,w); icon(c,'skincare',n*0.68,n*0.68,z,WHITE,w); } },
];

function canvasFor(opt, px, cls) {
  const c = document.createElement('canvas');
  c.width = c.height = px * 2; // sharp on phone screens
  if (cls) c.className = cls;
  opt.draw(c.getContext('2d'), px * 2);
  return c;
}

const grid = document.getElementById('grid');
OPTIONS.forEach((o) => {
  const box = document.createElement('div');
  box.className = 'opt';
  box.appendChild(canvasFor(o, 120));
  const small = document.createElement('div');
  small.className = 'small';
  small.appendChild(canvasFor(o, 32));
  small.appendChild(canvasFor(o, 16, 'xs'));
  box.appendChild(small);
  box.insertAdjacentHTML('beforeend', `<b>${o.title}</b><span>${o.note}</span>`);
  grid.appendChild(box);
});
</script>
</body>
</html>
